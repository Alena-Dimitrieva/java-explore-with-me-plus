spring:
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      schema-locations: classpath:schema-h2.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ewm-user
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
  config:
    import: "optional:configserver:"

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false