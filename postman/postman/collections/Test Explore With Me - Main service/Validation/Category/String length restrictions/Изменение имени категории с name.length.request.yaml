$kind: http-request
name: Изменение имени категории с name.length > 50
url: "{{baseUrl}}/admin/categories/:catId"
method: PATCH
pathVariables:
  catId: "{{catid}}"
body:
  type: text
  content: "{{request_body}}"
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \    let category\r

      \    try {\r

      \        category = await api.addCategory(rnd.getCategory());\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      \    pm.collectionVariables.set(\"catid\", Number(category.id))\r

      \    pm.request.body.update({\r

      \        mode: 'raw',\r

      \        raw: JSON.stringify({\r

      \            name : rnd.getWord(51)\r

      \        }),\r

      \        options: { raw: { language: 'json' } }\r

      \    });\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 400 и данные в формате json\", function () {\r

      \    pm.response.to.be.badRequest;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r\n"
    language: text/javascript
order: 3000
