$kind: http-request
name: Получение категорий без нескольких Query params
url: "{{baseUrl}}/categories"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: from
    value: "0"
    disabled: true
    description: количество категорий, которые нужно пропустить для формирования текущего набора
  - key: size
    value: "10000"
    disabled: true
    description: количество категорий в наборе
scripts:
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 200 и данные в формате json\", function () {\r

      \    pm.response.to.be.ok;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });"
    language: text/javascript
order: 1000
