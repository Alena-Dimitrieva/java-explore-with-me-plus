$kind: http-request
name: Добавление пользователя с domain.part.length > 63
url: "{{baseUrl}}/admin/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{{request_body}}"
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    let user;\r

      \    try {\r

      \        user = rnd.getUser();\r

      \        user.email = rnd.getWord(1) + '@' + rnd.getWord(64) + '.ru';\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      \r

      \    pm.request.body.update({\r

      \        mode: 'raw',\r

      \        raw: JSON.stringify(user),\r

      \        options: { raw: { language: 'json' } }\r

      \    });\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 400 и данные в формате json\", function () {\r

      \    pm.response.to.be.badRequest;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r\n"
    language: text/javascript
order: 9000
