$kind: http-request
name: Обновить названия подборки с title.length > 50
url: "{{baseUrl}}/admin/compilations/:compId"
method: PATCH
pathVariables:
  compId: "{{compid}}"
body:
  type: text
  content: "{{request_body}}"
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const compilation = await api.addCompilation(rnd.getCompilation());\r

      \        pm.collectionVariables.set('compid', compilation.id);\r

      \        pm.request.body.update({\r

      \            mode: 'raw',\r

      \            raw: JSON.stringify({\r

      \                title: rnd.getWord(51)\r

      \            }),\r

      \            options: { raw: { language: 'json' } }\r

      \        });\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            // выполняем наш скрипт\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 400 и данные в формате json\", function () {\r

      \    pm.response.to.be.badRequest;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r\n"
    language: text/javascript
order: 3000
