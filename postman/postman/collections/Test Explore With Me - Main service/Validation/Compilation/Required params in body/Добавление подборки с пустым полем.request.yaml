$kind: http-request
name: Добавление подборки с пустым полем title
url: "{{baseUrl}}/admin/compilations"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: ""
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    let compilation;\r

      \    try {\r

      \        const user = await api.addUser(rnd.getUser());\r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \        compilation = {\r

      \            \"pinned\":\"true\",\r

      \            \"title\": \"\"};\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      \r

      \    pm.request.body.update({\r

      \        mode: 'raw',\r

      \        raw: JSON.stringify(compilation),\r

      \        options: { raw: { language: 'json' } }\r

      \    });\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 400 и данные в формате json\", function () {\r

      \    pm.response.to.be.badRequest;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r\n"
    language: text/javascript
order: 2000
