$kind: http-request
url: "{{baseUrl}}/admin/users?ids={{uid}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: ids
    value: "{{uid}}"
    description: id пользователей
  - key: ids
    value: "-10833646"
    disabled: true
    description: id пользователей
  - key: from
    value: "0"
    disabled: true
    description: количество элементов, которые нужно пропустить для формирования текущего набора
  - key: size
    value: "10"
    disabled: true
    description: количество элементов в наборе
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    let compilation;\r

      \    try {\r

      \        const user = await api.addUser(rnd.getUser());\r

      \        pm.collectionVariables.set(\"uid\", user.id)\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 200 и данные в формате json\", function () {\r

      \    pm.response.to.be.ok;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const target = pm.response.json();\r

      \r

      pm.test(\"Пользователи должны содержать поля: id, name, email\", function () {\r

      \    pm.expect(target[0]).to.have.property('id');\r

      \    pm.expect(target[0]).to.have.property('name');\r

      \    pm.expect(target[0]).to.have.property('email');\r

      });\r

      \r

      pm.test(\"Должен быть найден только один пользователь по заданному фильтру\", function () {\r

      \    pm.expect(target.length).to.eql(1);\r

      });\r

      \r

      pm.test(\"Данные в ответе должны соответствовать данным в запросе\", function () {\r

      \    pm.expect(target[0].id).equal(pm.collectionVariables.get(\"uid\"));\r

      });"
    language: text/javascript
order: 1000
