$kind: http-request
name: Получение полной информации о событии добавленном текущим пользователем
url: "{{baseUrl}}/users/:userId/events/:eventId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: userId
    value: "{{uid}}"
    description: (Required) id текущего пользователя
  - key: eventId
    value: "{{eid}}"
    description: (Required) id события
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const user = await api.addUser(rnd.getUser());\r

      \        pm.collectionVariables.set(\"uid\", user.id)\r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \        const event = await api.addEvent(user.id, rnd.getEvent(category.id));\r

      \        pm.collectionVariables.set(\"eid\", event.id)\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 200 и данные в формате json\", function () {\r

      \    pm.response.to.be.ok;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const target = pm.response.json();\r

      \r

      pm.test(\"Событие должно содержать поля: id, title, annotation, category, paid, eventDate, initiator, description, participantLimit, state, createdOn, location, requestModeration\", function () {\r

      pm.expect(target).to.have.property('id');\r

      pm.expect(target).to.have.property('title');\r

      pm.expect(target).to.have.property('annotation');\r

      pm.expect(target).to.have.property('category');\r

      pm.expect(target).to.have.property('paid');\r

      pm.expect(target).to.have.property('eventDate');\r

      pm.expect(target).to.have.property('initiator');\r

      pm.expect(target).to.have.property('description');\r

      pm.expect(target).to.have.property('participantLimit');\r

      pm.expect(target).to.have.property('state');\r

      pm.expect(target).to.have.property('createdOn');\r

      pm.expect(target).to.have.property('location');\r

      pm.expect(target).to.have.property('requestModeration');\r

      });\r

      \r

      pm.test(\"Данные в ответе должны соответствовать данным в запросе\", function () {\r

      \    pm.expect(target.id).to.not.be.null;\r

      });"
    language: text/javascript
order: 7000
