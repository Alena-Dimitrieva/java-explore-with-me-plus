$kind: http-request
name: Получение событий, добавленных текущим пользователем
url: "{{baseUrl}}/users/:userId/events?from=0&size=1000"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: from
    value: "0"
    description: количество элементов, которые нужно пропустить для формирования текущего набора
  - key: size
    value: "1000"
    description: количество элементов в наборе
pathVariables:
  - key: userId
    value: "{{uid}}"
    description: (Required) id текущего пользователя
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const user = await api.addUser(rnd.getUser());\r

      \        pm.collectionVariables.set(\"uid\", user.id)\r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \        const event = await api.addEvent(user.id, rnd.getEvent(category.id));\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 200 и данные в формате json\", function () {\r

      \    pm.response.to.be.ok;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const target = pm.response.json()[0];\r

      \r

      pm.test(\"Событие должно содержать поля: id, title, annotation, category, paid, eventDate\", function () {\r

      \    pm.expect(target).to.contain.keys('id', 'title', 'annotation', 'category', 'paid', 'eventDate');\r

      });\r

      \r

      pm.test(\"Данные в ответе должны соответствовать данным в запросе\", function () {\r

      \    pm.expect(target.id).to.not.be.null;\r

      });"
    language: text/javascript
order: 4000
