$kind: http-request
name: Добавление запроса от инициатора события на участие в нём
description: |-
  Обратите внимание:
  - нельзя добавить повторный запрос
  - инициатор события не может добавить запрос на участие в своём событии
  - нельзя участвовать в неопубликованном событии
  - если у события достигнут лимит запросов на участие - необходимо вернуть ошибку
  - если для события отключена пре-модерация запросов на участие, то запрос должен автоматически перейти в состояние подтвержденного
url: "{{baseUrl}}/users/:userId/requests?eventId=0"
method: POST
headers:
  Accept: application/json
queryParams:
  - key: eventId
    value: "0"
    description: (Required) id события
pathVariables:
  - key: userId
    value: "{{uid}}"
    description: (Required) id текущего пользователя
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const user = await api.addUser(rnd.getUser());\r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \        let event = await api.addEvent(user.id, rnd.getEvent(category.id));\r

      \        event = await api.publishEvent(event.id);\r

      \        pm.request.removeQueryParams(['eventId']);\r

      \        pm.request.addQueryParams([`eventId=` + event.id]);\r

      \        pm.collectionVariables.set('uid', user.id);\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            // выполняем наш скрипт\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 409 и данные в формате json\", function () {\r

      \    pm.response.to.have.status(409);\r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });"
    language: text/javascript
order: 10000
