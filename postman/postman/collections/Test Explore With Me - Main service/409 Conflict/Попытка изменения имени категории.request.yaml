$kind: http-request
name: Попытка изменения имени категории на уже существующее
description: "Обратите внимание: имя категории должно быть уникальным"
url: "{{baseUrl}}/admin/categories/:catId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  catId: "{{catid}}"
body:
  type: json
  content: "{{request_body}}"
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \    let category1, category2\r

      \    try {\r

      \        category1 = await api.addCategory(rnd.getCategory());\r

      \        category2 = await api.addCategory(rnd.getCategory());\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      \    pm.collectionVariables.set(\"catid\", category2.id)\r

      \    pm.request.body.update({\r

      \        mode: 'raw',\r

      \        raw: JSON.stringify({\r

      \            name : category1.name\r

      \        }),\r

      \        options: { raw: { language: 'json' } }\r

      \    });\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 409 и данные в формате json\", function () {\r

      \    pm.response.to.have.status(409);\r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });"
    language: text/javascript
order: 1000
