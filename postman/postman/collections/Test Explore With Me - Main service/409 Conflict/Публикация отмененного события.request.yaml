$kind: http-request
description: |-
  Обратите внимание:
   - дата начала события должна быть не ранее чем за час от даты публикации.
  - событие должно быть в состоянии ожидания публикации
url: "{{baseUrl}}/admin/events/:eventId"
method: PATCH
headers:
  Accept: application/json
pathVariables:
  - key: eventId
    value: "{{eid}}"
    description: (Required) id события
body:
  type: text
  content: "{{request_body}}"
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const user = await api.addUser(rnd.getUser());\r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \        let event = await api.addEvent(user.id, rnd.getEvent(category.id));\r

      \        event = await api.rejectEvent(event.id);\r

      \        pm.collectionVariables.set(\"eid\", event.id)\r

      \        pm.request.body.update({\r

      \            mode: 'raw',\r

      \            raw: JSON.stringify({\r

      \                stateAction : \"PUBLISH_EVENT\"\r

      \            }),\r

      \            options: { raw: { language: 'json' } }\r

      \        });\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            // выполняем наш скрипт\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 409 и данные в формате json\", function () {\r

      \    pm.response.to.have.status(409);\r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });"
    language: text/javascript
order: 7000
