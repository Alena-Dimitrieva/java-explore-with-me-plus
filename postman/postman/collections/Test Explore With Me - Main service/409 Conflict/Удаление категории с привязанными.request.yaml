$kind: http-request
name: Удаление категории с привязанными событиями
description: "Обратите внимание: с категорий не должно быть связано ни одного события."
url: "{{baseUrl}}/admin/categories/:catId"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  catId: "{{catid}}"
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \        const user = await api.addUser(rnd.getUser());\r

      \        const event = await api.addEvent(user.id, rnd.getEvent(category.id));\r

      \        pm.collectionVariables.set('catid', category.id);\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 409 и данные в формате json\", function () {\r

      \    pm.response.to.have.status(409);\r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });"
    language: text/javascript
order: 4000
