$kind: http-request
description: "Обратите внимание: дата и время на которые намечено событие не может быть раньше, чем через два часа от текущего момента"
url: "{{baseUrl}}/users/:userId/events/:eventId/likes"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: userId
    value: "{{uid}}"
    description: (Required) id текущего пользователя
  - key: eventId
    value: "{{eid}}"
    description: (Required) id текущего события
body:
  type: json
  content: |-
    {
        "reaction" : "DISLIKE"
    }
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const initiator = await api.addUser(rnd.getUser());\r

      \r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \r

      \        let event = await api.addEvent(initiator.id, rnd.getEvent(category.id));\r

      \        pm.collectionVariables.set(\"eid\", event.id);\r

      \r

      \        event = await api.publishEvent(event.id);\r

      \r

      \        const user = await api.addUser(rnd.getUser());\r

      \        pm.collectionVariables.set(\"uid\", user.id);\r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 201 и данные в формате json\", function () {\r

      \    pm.response.to.have.status(201);  \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const source = JSON.parse(pm.request.body.raw);\r

      const target = pm.response.json();\r

      \r

      pm.test(\"Ответ должен содержать поля: id, userId, eventId, reaction\", function () {\r

      \    pm.expect(target).to.have.property('id');\r

      \    pm.expect(target).to.have.property('userId');\r

      \    pm.expect(target).to.have.property('eventId');\r

      \    pm.expect(target).to.have.property('reaction');\r

      });\r

      \r

      pm.test(\"Проверка данных в полях ответа\", function () {\r

      \    pm.expect(target.id).to.not.be.null;\r

      \    pm.expect(target.userId).to.equal(pm.collectionVariables.get('uid'));\r

      \    pm.expect(target.eventId).to.equal(pm.collectionVariables.get('eid'));\r

      \    pm.expect(target.reaction).to.equal('DISLIKE');\r

      });"
    language: text/javascript
order: 2000
