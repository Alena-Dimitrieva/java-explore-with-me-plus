$kind: http-request
name: Получение события после добавления лайка
url: "{{baseUrl}}/users/:userId/events/:eventId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: userId
    value: "{{uid}}"
    description: (Required) id текущего пользователя
  - key: eventId
    value: "{{eid}}"
    description: (Required) id текущего события
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        const initiator = await api.addUser(rnd.getUser());\r

      \        pm.collectionVariables.set(\"uid\", initiator.id)\r

      \r

      \        const category = await api.addCategory(rnd.getCategory());\r

      \r

      \        let event = await api.addEvent(initiator.id, rnd.getEvent(category.id));\r

      \        pm.collectionVariables.set(\"eid\", event.id);\r

      \r

      \        event = await api.publishEvent(event.id);\r

      \        \r

      \        const user = await api.addUser(rnd.getUser());\r

      \        const like = await api.addLike(user.id, event.id);\r

      \r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Ответ должен содержать код статуса 200 и данные в формате json\", function () {\r

      \    pm.response.to.be.ok;    \r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const target = pm.response.json();\r

      \r

      pm.test(\"Событие должно содержать поля: id, title, annotation, category, paid, eventDate, 'initiator', 'location', 'confirmedRequests', 'requestModeration', 'publishedOn', 'state', 'views', 'rate'\", function () {\r

      \    pm.expect(target).to.contain.keys('id', 'title', 'annotation', 'category', 'paid', 'eventDate', 'initiator', 'location', 'confirmedRequests', 'requestModeration', 'publishedOn', 'state', 'views', 'rate');\r

      });\r

      \r

      pm.test(\"Данные в ответе должны соответствовать данным в запросе\", function () {\r

      \    pm.expect(target.id).to.not.be.null;\r

      });\r

      \r

      pm.test(\"Поле rate должно быть равно 1\", function () {\r

      \    pm.expect(target.rate).to.equal(1);\r

      });"
    language: text/javascript
order: 3000
