server:
  port: 8761

spring:
  application:
    name: discovery-server
  main:
    banner-mode: OFF

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:${server.port}/eureka/
  server:
    eviction-interval-timer-in-ms: 3000
    response-cache-update-interval-ms: 3000

logging:
  level:
    root: info
